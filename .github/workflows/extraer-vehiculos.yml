name: Extraer vehículos (matrícula → kType)

on:
  push:
    paths:
      - '.github/workflows/extraer-vehiculos.yml'
      - 'scripts/extraer-vehiculos.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Barrer la API y generar CSV
        run: node scripts/extraer-vehiculos.mjs

      - name: Commitear resultados
        run: |
          git config user.name "robot-tester"
          git config user.email "gmolinazafra@gmail.com"
          git add vehiculos_matricula_ktype.csv vehiculos_resumen.json piezas_vehiculo.csv
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "datos: vehiculos matricula-ktype (extraccion automatica)"
            git push
          fi
