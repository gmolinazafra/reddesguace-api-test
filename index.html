<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Desguace · API Test</title>
<style>
  :root {
    --verde:       #1B4332;
    --verde-med:   #2D6A4F;
    --verde-claro: #52B788;
    --naranja:     #E76F51;
    --fondo:       #F8F9FA;
    --blanco:      #FFFFFF;
    --gris-1:      #F1F3F5;
    --gris-2:      #DEE2E6;
    --gris-3:      #868E96;
    --tinta:       #212529;
    --sombra:      0 2px 8px rgba(0,0,0,0.08);
    --radio:       10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--tinta); line-height: 1.5; }

  /* HEADER */
  header { background: var(--verde); color: white; padding: 16px 24px; display: flex; align-items: center; gap: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); position: sticky; top: 0; z-index: 100; }
  .logo { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
  .logo span { color: var(--verde-claro); }
  .badge-test { background: var(--naranja); color: white; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; letter-spacing: 1px; text-transform: uppercase; }
  header .spacer { flex: 1; }
  .stats-header { font-size: 12px; opacity: 0.7; text-align: right; }
  .stats-header strong { color: var(--verde-claro); font-size: 14px; }

  /* BUSCADOR */
  .buscador-wrap { background: var(--verde-med); padding: 24px; }
  .buscador-inner { max-width: 900px; margin: 0 auto; }
  .buscador-inner h2 { color: white; font-size: 14px; font-weight: 600; margin-bottom: 12px; opacity: 0.85; }
  .buscador-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .buscador-row input, .buscador-row select { flex: 1; min-width: 160px; padding: 10px 14px; border: none; border-radius: var(--radio); font-size: 14px; background: rgba(255,255,255,0.15); color: white; outline: none; }
  .buscador-row input::placeholder { color: rgba(255,255,255,0.5); }
  .buscador-row select option { background: var(--verde); color: white; }
  .btn-buscar { background: var(--naranja); color: white; border: none; padding: 10px 24px; border-radius: var(--radio); font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; transition: opacity 0.15s; }
  .btn-buscar:hover { opacity: 0.9; }
  .btn-buscar:disabled { opacity: 0.5; cursor: not-allowed; }

  /* SELECTOR DE FUENTE + BARRA LIVE */
  .fuente-toggle { display: flex; gap: 8px; margin-bottom: 12px; }
  .fuente-toggle button { border: 1px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.1); color: white; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .fuente-toggle button.activo { background: var(--naranja); border-color: var(--naranja); }
  .live-bar { display: none; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .live-bar.visible { display: flex; }
  .live-bar input { padding: 8px 12px; border: none; border-radius: 8px; font-size: 13px; background: rgba(255,255,255,0.15); color: white; outline: none; min-width: 180px; }
  .live-bar input::placeholder { color: rgba(255,255,255,0.5); }
  .btn-live { background: rgba(255,255,255,0.9); color: var(--verde); border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; }
  .btn-live:hover { background: white; }
  .btn-live:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-live.peligro { background: var(--naranja); color: white; }
  .live-info { font-size: 12px; color: rgba(255,255,255,0.85); }
  .live-info strong { color: white; }

  /* LAYOUT PRINCIPAL */
  .main { max-width: 900px; margin: 0 auto; padding: 24px; }

  /* ESTADO */
  .estado { text-align: center; padding: 48px 24px; color: var(--gris-3); }
  .estado .ico { font-size: 40px; margin-bottom: 12px; }
  .estado p { font-size: 15px; }
  .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid var(--gris-2); border-top-color: var(--verde); border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* GRID PIEZAS */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .card { background: var(--blanco); border-radius: var(--radio); box-shadow: var(--sombra); overflow: hidden; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; border: 2px solid transparent; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
  .card.activa { border-color: var(--verde-claro); }
  .card-img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--gris-1); display: block; }
  .card-img-placeholder { width: 100%; aspect-ratio: 1; background: var(--gris-1); display: flex; align-items: center; justify-content: center; font-size: 32px; color: var(--gris-2); }
  .card-body { padding: 12px; }
  .card-ref { font-size: 10px; font-weight: 700; color: var(--naranja); text-transform: uppercase; letter-spacing: 0.5px; }
  .card-titulo { font-size: 13px; font-weight: 700; color: var(--tinta); margin: 4px 0 2px; line-height: 1.3; }
  .card-vehiculo { font-size: 11px; color: var(--gris-3); }
  .card-precio { font-size: 16px; font-weight: 800; color: var(--verde); margin-top: 8px; }
  .card-precio.sin-precio { color: var(--gris-3); font-size: 12px; font-weight: 400; }

  /* PANEL DETALLE */
  .detalle { background: var(--blanco); border-radius: var(--radio); box-shadow: var(--sombra); margin-bottom: 24px; overflow: hidden; }
  .detalle-header { background: var(--verde); color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
  .detalle-header h3 { font-size: 16px; font-weight: 700; }
  .btn-cerrar { background: rgba(255,255,255,0.15); border: none; color: white; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .detalle-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  @media (max-width: 600px) { .detalle-body { grid-template-columns: 1fr; } }

  .detalle-fotos { padding: 16px; background: var(--gris-1); }
  .foto-principal { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 8px; background: var(--gris-2); }
  .fotos-thumb { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .fotos-thumb img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
  .fotos-thumb img:hover, .fotos-thumb img.activa { border-color: var(--verde-claro); }
  .sin-foto { width: 100%; aspect-ratio: 4/3; background: var(--gris-2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 40px; color: var(--gris-3); }

  .detalle-info { padding: 16px; overflow-y: auto; max-height: 500px; }
  .detalle-precio { font-size: 28px; font-weight: 800; color: var(--verde); margin-bottom: 16px; }
  .detalle-precio small { font-size: 12px; font-weight: 400; color: var(--gris-3); display: block; }

  .seccion { margin-bottom: 16px; }
  .seccion-titulo { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--gris-3); margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--gris-2); }
  .dato-row { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; font-size: 13px; border-bottom: 1px solid var(--gris-1); }
  .dato-row:last-child { border-bottom: none; }
  .dato-label { color: var(--gris-3); flex-shrink: 0; margin-right: 8px; }
  .dato-valor { font-weight: 600; text-align: right; word-break: break-all; }
  .tag-ktype { display: inline-block; background: var(--naranja); color: white; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
  .tag-codver { display: inline-block; background: var(--verde-med); color: white; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 4px; font-family: monospace; }

  /* PAGINACION */
  .paginacion { display: flex; justify-content: center; gap: 8px; margin-top: 24px; }
  .paginacion button { padding: 8px 16px; border: 1px solid var(--gris-2); background: var(--blanco); border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .paginacion button:hover { background: var(--verde); color: white; border-color: var(--verde); }
  .paginacion button:disabled { opacity: 0.4; cursor: not-allowed; }
  .paginacion .info-pag { padding: 8px 12px; font-size: 13px; color: var(--gris-3); }

  /* EXTRA DATOS badge */
  .extra-badge { display: inline-block; background: #E8F5E9; color: var(--verde-med); font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-left: 4px; }
  .badge-reservada { display: inline-block; background: #FFE3E3; color: #C92A2A; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-left: 4px; }
</style>
</head>
<body>

<header>
  <div class="logo">Red <span>Desguace</span></div>
  <div class="badge-test">API TEST</div>
  <div class="spacer"></div>
  <div class="stats-header" id="stats-header">Conectando...</div>
</header>

<div class="buscador-wrap">
  <div class="buscador-inner">
    <div class="fuente-toggle">
      <button id="btn-modo-json" class="activo" onclick="cambiarModo('json')">📦 JSON 12-jul</button>
      <button id="btn-modo-live" onclick="cambiarModo('live')">🔴 API en vivo</button>
    </div>
    <h2 id="titulo-buscador">🔍 Buscar en inventario Metasync (foto estática del 12-jul)</h2>
    <div class="buscador-row">
      <input type="text" id="q" placeholder="Artículo, referencia..." />
      <input type="text" id="marca" placeholder="Marca vehículo..." />
      <input type="text" id="modelo" placeholder="Modelo..." />
      <input type="text" id="ktype" placeholder="kType..." style="max-width:110px" />
      <select id="filtro-precio" onchange="buscar()" style="max-width:150px">
        <option value="">Precio: todas</option>
        <option value="con">Con precio</option>
        <option value="sin">Sin precio</option>
      </select>
      <button class="btn-buscar" id="btn-buscar" onclick="buscar()">Buscar</button>
    </div>
    <div class="live-bar" id="live-bar">
      <input type="text" id="live-fecha" value="01/01/2015 00:00:00" placeholder="dd/mm/yyyy HH:MM:SS" title="Fecha desde (cambios posteriores a esta fecha)" />
      <button class="btn-live" id="btn-pagina" onclick="traerPagina()">Traer 1.000</button>
      <button class="btn-live" id="btn-todo" onclick="traerTodo()">Traer TODO</button>
      <button class="btn-live peligro" id="btn-detener" onclick="detenerCarga()" style="display:none">■ Detener</button>
      <button class="btn-live" id="btn-reiniciar" onclick="reiniciarLive()">↺ Reiniciar</button>
      <span class="live-info" id="live-info">Sin datos cargados. Pulsa «Traer 1.000».</span>
    </div>
  </div>
</div>

<div class="main">
  <div id="detalle-wrap" style="display:none"></div>
  <div id="resultado">
    <div class="estado">
      <div class="ico">🔧</div>
      <p>Introduce un término de búsqueda para explorar el inventario.</p>
    </div>
  </div>
  <div id="paginacion-wrap"></div>
</div>

<script>
// ============================================================
// CONFIG
// ============================================================
// Proxy: api/inventario.js de ESTE MISMO repo, desplegado como
// proyecto Vercel propio (separado de la web real). Se prueban
// en orden y se recuerda el primero que responda.
const PROXY_URLS = [
  '/api/inventario', // mismo origen (si se abre desde vercel.app)
  'https://reddesguace-api-test.vercel.app/api/inventario',
  'https://reddesguace-api-test-gmolinazafras-projects.vercel.app/api/inventario',
];
let proxyUrlOk = null;

const OFFSET_API  = 1000;   // piezas por página de la API (igual que el sync)
const POR_PAGINA  = 20;     // fichas por página en la UI

// Enum Ubicacion de la API Metasync (manual ApiInventario, 23-jul).
// Las ubicaciones 2 (ConIncidencia), 5 (Desechada) y 8 (Vendida) se
// GUARDAN en el mapa (mina futura de ktypes y precios) pero NO se
// pintan en la parrilla; el contador de la barra live las desglosa.
const UBICACION_NOMBRE = {
  0: 'En proceso de desmontaje', 1: 'Almacenada', 2: 'Con incidencia',
  3: 'En reparto', 4: 'En control de calidad', 5: 'Desechada',
  6: 'En mostrador', 7: 'Montada revisada', 8: 'Vendida',
  9: 'Situación desconocida',
};
const UBICACIONES_OCULTAS = new Set([2, 5, 8, 9]); // 9 (Situación desconocida) fuera también: se cuelan piezas fantasma

// ============================================================
// ESTADO
// ============================================================
let modo = 'json';               // 'json' | 'live'
let inventarioCompleto = null;   // foto estática (inventario.json)

let livePiezasMap  = new Map();  // refLocal → pieza normalizada (evita duplicados)
let liveVehiculos  = {};         // idLocal(string) → vehículo normalizado
let liveLastId     = 0;
let liveTotal      = null;
let liveFin        = false;
let cargaCancelada = false;
let cargandoTodo   = false;

let piezasTodas  = [];
let paginaActual = 1;
let ultimasOcultasUbicacion = 0;

// ============================================================
// ARRANQUE (modo JSON estático, igual que siempre)
// ============================================================
async function init() {
  mostrarCargando();
  try {
    const res = await fetch('./inventario.json?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    inventarioCompleto = await res.json();
    actualizarStats();
    buscar();
  } catch(e) {
    mostrarEstado('❌', 'Error cargando inventario: ' + e.message);
  }
}
init();

// ============================================================
// FUENTE DE DATOS
// ============================================================
function datosActuales() {
  if (modo === 'live') {
    return { piezas: [...livePiezasMap.values()], vehiculos: liveVehiculos };
  }
  if (!inventarioCompleto) return null;
  return {
    piezas:    inventarioCompleto.piezas    || [],
    vehiculos: inventarioCompleto.vehiculos || {},
  };
}

function cambiarModo(m) {
  modo = m;
  document.getElementById('btn-modo-json').classList.toggle('activo', m === 'json');
  document.getElementById('btn-modo-live').classList.toggle('activo', m === 'live');
  document.getElementById('live-bar').classList.toggle('visible', m === 'live');
  document.getElementById('titulo-buscador').textContent = m === 'live'
    ? '🔍 Buscar en inventario Metasync (API EN VIVO vía proxy)'
    : '🔍 Buscar en inventario Metasync (foto estática del 12-jul)';
  cerrarDetalle();
  actualizarStats();
  buscar();
}

function actualizarStats() {
  const el = document.getElementById('stats-header');
  if (modo === 'live') {
    const n = livePiezasMap.size;
    el.innerHTML = 'API en vivo: <strong>' + n.toLocaleString('es-ES') + '</strong> piezas cargadas'
      + (liveTotal !== null ? ' de <strong>' + liveTotal.toLocaleString('es-ES') + '</strong>' : '')
      + (ultimasOcultasUbicacion > 0
        ? ' · ' + ultimasOcultasUbicacion.toLocaleString('es-ES') + ' vendidas/baja ocultas'
        : '');
  } else if (inventarioCompleto) {
    el.innerHTML = 'Inventario 12-jul: <strong>' + inventarioCompleto.total.toLocaleString('es-ES') + '</strong> piezas';
  } else {
    el.textContent = 'Conectando...';
  }
}

// ============================================================
// API EN VIVO (vía proxy Vercel)
// ============================================================
function normalizarPiezaAPI(p) {
  return {
    id:                 p.refLocal,
    refLocal:           p.refLocal,
    idLocal:            p.idLocal,
    articulo:           p.descripcionArticulo || '',
    familia:            p.descripcionFamilia  || '',
    codFamilia:         p.codFamilia,
    descripcionFamilia: p.descripcionFamilia,
    refPrincipal:       p.refPrincipal,
    refOficial:         p.refOficial,
    anyoStock:          p.anyoStock,
    precio:             p.precio > 0 ? p.precio / 100 : 0,  // CONFIRMADO con volcado 23-jul: la API manda CENTIMOS (mediana 1635 = 16,35 EUR), como dice el manual. El 'fix' del 12-jul que quito la division era erroneo.
    peso:               p.peso,
    pesoKg:             p.peso > 0 ? p.peso / 1000 : null,   // manual: peso en GRAMOS
    ubicacion:          p.ubicacion,
    tipoMaterial:       p.tipoMaterial,
    observaciones:      p.observaciones,
    idVehiculo:         p.idVehiculo,
    fotos:              p.urlsImgs || [],
    reserva:            p.reserva,
    codigoMotor:        p.codigoMotor,
    fechaMod:           p.fechaMod,
  };
}

function normalizarVehiculoAPI(v) {
  return {
    marca:        v.nombreMarca   || '',
    modelo:       v.nombreModelo  || '',
    version:      v.nombreVersion || '',
    anyoInicio:   v.anyoInicio,
    anyoFin:      v.anyoFin,
    anioInicio:   v.anyoInicio,   // la card usa anioInicio
    anioFin:      v.anyoFin,
    anyoVehiculo: v.anyoVehiculo,
    combustible:  v.combustible,
    puertas:      v.puertas,
    codigoMotor:  v.codigoMotor,
    cilindrada:   v.cilindrada,
    potenciaKw:   v.potenciaKw,
    potenciaHP:   v.potenciaHP,
    transmision:  v.transmision,
    bastidor:     v.bastidor,
    matricula:    v.matricula,
    color:        v.color,
    kilometraje:  v.kilometraje,
    ktype:        v.ktype,
    codVersion:   v.codVersion,
    rvCode:       v.rvCode,
    tiposMotor:   v.tiposMotor,
  };
}

async function llamarProxy(lastid, fecha) {
  let ultimoErr = null;
  const bases = proxyUrlOk ? [proxyUrlOk] : PROXY_URLS;
  for (const base of bases) {
    try {
      const url = base + '?lastid=' + lastid + '&offset=' + OFFSET_API + '&fecha=' + encodeURIComponent(fecha);
      const res = await fetch(url);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      proxyUrlOk = base;
      return data;
    } catch(e) {
      ultimoErr = e;
    }
  }
  throw ultimoErr || new Error('Proxy inaccesible');
}

function integrarRespuesta(data) {
  const { piezas = [], vehiculos = [], result_set } = data;
  for (const v of vehiculos) liveVehiculos[String(v.idLocal)] = normalizarVehiculoAPI(v);
  for (const p of piezas)    livePiezasMap.set(String(p.refLocal), normalizarPiezaAPI(p));
  if (result_set) {
    liveTotal  = result_set.total;
    liveLastId = result_set.lastId;
    liveFin    = result_set.count === 0 || result_set.count < OFFSET_API;
  }
  return { count: result_set ? result_set.count : piezas.length };
}

function setBotonesLive(ocupado) {
  document.getElementById('btn-pagina').disabled    = ocupado;
  document.getElementById('btn-todo').disabled      = ocupado;
  document.getElementById('btn-reiniciar').disabled = ocupado;
}

function infoLive(msg) {
  document.getElementById('live-info').innerHTML = msg;
}

async function traerPagina() {
  const fecha = document.getElementById('live-fecha').value.trim() || '01/01/2015 00:00:00';
  setBotonesLive(true);
  infoLive('⏳ Cargando página (lastId=' + liveLastId + ')...');
  try {
    const { count } = integrarRespuesta(await llamarProxy(liveLastId, fecha));
    actualizarStats();
    infoLive('✓ +' + count.toLocaleString('es-ES') + ' piezas · lastId=<strong>' + liveLastId + '</strong>'
      + (liveFin ? ' · <strong>FIN</strong>' : ''));
    buscar();
  } catch(e) {
    infoLive('❌ ' + e.message);
    mostrarEstado('❌', 'Error llamando al proxy: ' + e.message);
  } finally {
    setBotonesLive(false);
  }
}

async function traerTodo() {
  if (cargandoTodo) return;
  const fecha = document.getElementById('live-fecha').value.trim() || '01/01/2015 00:00:00';
  cargandoTodo   = true;
  cargaCancelada = false;
  setBotonesLive(true);
  document.getElementById('btn-detener').style.display = '';
  try {
    while (!liveFin && !cargaCancelada) {
      infoLive('⏳ ' + livePiezasMap.size.toLocaleString('es-ES')
        + (liveTotal !== null ? ' / ' + liveTotal.toLocaleString('es-ES') : '')
        + ' piezas · lastId=' + liveLastId + '...');
      integrarRespuesta(await llamarProxy(liveLastId, fecha));
      actualizarStats();
      await new Promise(r => setTimeout(r, 400)); // pausa entre páginas, como el sync
    }
    infoLive((cargaCancelada ? '⏸ Detenido en ' : '✓ Completo: ')
      + livePiezasMap.size.toLocaleString('es-ES') + ' piezas · lastId=<strong>' + liveLastId + '</strong>');
    buscar();
  } catch(e) {
    infoLive('❌ ' + e.message);
    mostrarEstado('❌', 'Error llamando al proxy: ' + e.message);
  } finally {
    cargandoTodo = false;
    document.getElementById('btn-detener').style.display = 'none';
    setBotonesLive(false);
  }
}

function detenerCarga() { cargaCancelada = true; }

function reiniciarLive() {
  livePiezasMap = new Map();
  liveVehiculos = {};
  liveLastId    = 0;
  liveTotal     = null;
  liveFin       = false;
  actualizarStats();
  infoLive('↺ Reiniciado. Sin datos cargados.');
  buscar();
}

// ============================================================
// BUSCADOR (común a ambas fuentes)
// ============================================================
function buscar() {
  const datos = datosActuales();
  if (!datos) return;

  const q      = document.getElementById('q').value.trim().toLowerCase();
  const marca  = document.getElementById('marca').value.trim().toLowerCase();
  const modelo = document.getElementById('modelo').value.trim().toLowerCase();
  const ktype  = document.getElementById('ktype').value.trim();
  const fPrecio = document.getElementById('filtro-precio').value;

  const { piezas, vehiculos } = datos;

  const filtradas = [];
  let ocultasUbicacion = 0;
  for (const p of piezas) {
    // Vendidas / desechadas / con incidencia: guardadas pero no visibles.
    if (modo === 'live' && UBICACIONES_OCULTAS.has(Number(p.ubicacion))) {
      ocultasUbicacion++;
      continue;
    }
    const desc = (p.articulo || '').toLowerCase();
    const veh  = vehiculos[String(p.idVehiculo)] || {};
    const marc = (veh.marca || '').toLowerCase();
    const mod  = (veh.modelo || '').toLowerCase();

    const okQ     = !q      || desc.includes(q);
    const okMarca = !marca  || marc.includes(marca);
    const okMod   = !modelo || mod.includes(modelo);
    const okKtype = !ktype  || String(veh.ktype || '') === ktype;
    const okFiltroPrecio = !fPrecio
      || (fPrecio === 'con' && p.precio > 0)
      || (fPrecio === 'sin' && !(p.precio > 0));
    // Sin filtros activos, el modo JSON (escaparate 171k) solo muestra
    // piezas con foto Y con precio. En modo LIVE ese filtro ocultaba TODO
    // lo cargado (las primeras paginas del inventario son piezas antiguas
    // sin foto y con precio -1): en live se muestra todo lo traido.
    const hayFiltro = q || marca || modelo || ktype || fPrecio;
    const okFoto   = modo === 'live' || hayFiltro || (p.fotos && p.fotos.length > 0);
    const okPrecio = modo === 'live' || hayFiltro || (p.precio > 0);

    if (okQ && okMarca && okMod && okKtype && okFoto && okPrecio && okFiltroPrecio) {
      filtradas.push({ ...p, _veh: veh });
    }
  }

  piezasTodas = filtradas;
  ultimasOcultasUbicacion = ocultasUbicacion;
  paginaActual = 1;
  renderResultados();
}

function renderResultados() {
  const total = piezasTodas.length;
  const inicio = (paginaActual - 1) * POR_PAGINA;
  const fin    = Math.min(inicio + POR_PAGINA, total);
  const pagina = piezasTodas.slice(inicio, fin);
  const totalPags = Math.ceil(total / POR_PAGINA);

  if (total === 0) {
    if (modo === 'live' && livePiezasMap.size === 0) {
      mostrarEstado('📡', 'Modo API en vivo: pulsa «Traer 1.000» para cargar la primera página del inventario real.');
    } else {
      mostrarEstado('🔍', 'Sin resultados. Prueba con otros términos.');
    }
    document.getElementById('paginacion-wrap').innerHTML = '';
    return;
  }

  const html = `
    <p style="font-size:13px;color:var(--gris-3);margin-bottom:16px;">
      ${total.toLocaleString('es-ES')} piezas encontradas · mostrando ${inicio+1}–${fin}
    </p>
    <div class="grid">
      ${pagina.map((p, i) => cardHtml(p, inicio + i)).join('')}
    </div>
  `;
  document.getElementById('resultado').innerHTML = html;

  // Paginación
  document.getElementById('paginacion-wrap').innerHTML = totalPags > 1 ? `
    <div class="paginacion">
      <button onclick="irPagina(${paginaActual-1})" ${paginaActual===1?'disabled':''}>← Anterior</button>
      <span class="info-pag">Página ${paginaActual} de ${totalPags}</span>
      <button onclick="irPagina(${paginaActual+1})" ${paginaActual===totalPags?'disabled':''}>Siguiente →</button>
    </div>
  ` : '';
}

function cardHtml(p, idx) {
  const veh    = p._veh || {};
  const precio = p.precio > 0 ? p.precio.toFixed(2) + ' €' : null;
  const img    = p.fotos?.[0];
  const ktype  = veh.ktype ? `<span class="extra-badge">kType ${veh.ktype}</span>` : '';
  const resv   = p.reserva > 0 ? `<span class="badge-reservada">RESERVADA</span>` : '';

  return `
    <div class="card" onclick="abrirDetalle(${idx})">
      ${img
        ? `<img class="card-img" src="${img}" alt="${p.articulo||''}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : ''}
      <div class="card-img-placeholder" ${img?'style="display:none"':''}>🔧</div>
      <div class="card-body">
        <div class="card-ref">REF ${p.id||'—'} ${ktype}${resv}</div>
        <div class="card-titulo">${p.articulo||'Sin descripción'}</div>
        <div class="card-vehiculo">${veh.marca||''} ${veh.modelo ? veh.modelo + (veh.anioInicio ? ' · ' + veh.anioInicio + (veh.anioFin ? '–' + veh.anioFin : '') : '') : ''}</div>
        ${precio
          ? `<div class="card-precio">${precio}</div>`
          : `<div class="card-precio sin-precio">Sin precio</div>`}
      </div>
    </div>
  `;
}

function abrirDetalle(idx) {
  const inicio = (paginaActual - 1) * POR_PAGINA;
  const p = piezasTodas[inicio + idx];
  if (!p) return;

  const veh    = p._veh || {};
  const precio = p.precio > 0 ? p.precio.toFixed(2) + ' €' : 'Sin precio';
  const img    = p.fotos?.[0];
  const thumbs = (p.fotos || []).slice(0, 8);

  document.getElementById('detalle-wrap').style.display = 'block';
  document.getElementById('detalle-wrap').innerHTML = `
    <div class="detalle">
      <div class="detalle-header">
        <h3>${p.articulo || 'Sin descripción'}</h3>
        <button class="btn-cerrar" onclick="cerrarDetalle()">✕ Cerrar</button>
      </div>
      <div class="detalle-body">
        <div class="detalle-fotos">
          ${img
            ? `<img class="foto-principal" id="foto-principal" src="${img}" alt="">`
            : `<div class="sin-foto">📷</div>`}
          ${thumbs.length > 1 ? `
            <div class="fotos-thumb">
              ${thumbs.map((u,i) => `<img src="${u}" class="${i===0?'activa':''}" onclick="cambiarFoto('${u}', this)">`).join('')}
            </div>
          ` : ''}
        </div>
        <div class="detalle-info">
          <div class="detalle-precio">
            ${precio}
            <small>Precio Metasync (sin IVA)</small>
          </div>

          <div class="seccion">
            <div class="seccion-titulo">📋 Pieza</div>
            ${dato('Referencia', p.refLocal || p.idLocal)}
            ${dato('Artículo', p.familia)}
            ${dato('Descripción', p.articulo)}
            ${dato('Familia', p.codFamilia ? `${p.codFamilia} · ${p.descripcionFamilia||''}` : null)}
            ${dato('Ref. principal', p.refPrincipal)}
            ${dato('Ref. oficial', p.refOficial)}
            ${dato('Año stock', p.anyoStock || null)}
            ${dato('Peso', p.pesoKg != null ? `${p.pesoKg.toFixed(1)} kg` : (p.peso ? `${(p.peso/100).toFixed(1)} kg` : null))}
            ${dato('Ubicación', p.ubicacion != null && UBICACION_NOMBRE[p.ubicacion] !== undefined
              ? `${UBICACION_NOMBRE[p.ubicacion]} (${p.ubicacion})`
              : p.ubicacion)}
            ${dato('Tipo material', p.tipoMaterial)}
            ${dato('Observaciones', p.observaciones)}
            ${dato('Reserva', p.reserva)}
            ${dato('Fecha mod.', p.fechaMod)}
          </div>

          <div class="seccion">
            <div class="seccion-titulo">🚗 Vehículo donante</div>
            ${dato('Marca', veh.marca)}
            ${dato('Modelo', veh.modelo)}
            ${dato('Versión', veh.version)}
            ${dato('Años', veh.anyoInicio ? `${veh.anyoInicio}–${veh.anyoFin||''}` : null)}
            ${dato('Combustible', veh.combustible)}
            ${dato('Puertas', veh.puertas)}
            ${dato('Motor', veh.codigoMotor || p.codigoMotor)}
            ${dato('Cilindrada', veh.cilindrada ? `${veh.cilindrada} cc` : null)}
            ${dato('Potencia', veh.potenciaKw ? `${veh.potenciaKw} kW / ${veh.potenciaHP} CV` : null)}
            ${dato('Transmisión', veh.transmision)}
            ${dato('Bastidor', veh.bastidor)}
            ${dato('Matrícula', veh.matricula)}
            ${dato('Color', veh.color)}
            ${dato('Km', veh.kilometraje ? veh.kilometraje.toLocaleString('es-ES') + ' km' : null)}
          </div>

          <div class="seccion">
            <div class="seccion-titulo">🔑 Datos TecDoc / Metasync</div>
            ${datoTag('ktype', veh.ktype, 'tag-ktype')}
            ${datoTag('codVersion', veh.codVersion, 'tag-codver')}
            ${dato('rvCode', veh.rvCode)}
            ${dato('ID local vehículo', p.idVehiculo)}
            ${dato('Tipos de motor', Array.isArray(veh.tiposMotor) ? veh.tiposMotor.join(', ') : null)}
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('detalle-wrap').scrollIntoView({ behavior: 'smooth' });
}

function cerrarDetalle() {
  document.getElementById('detalle-wrap').style.display = 'none';
  document.getElementById('detalle-wrap').innerHTML = '';
}

function cambiarFoto(url, el) {
  document.getElementById('foto-principal').src = url;
  document.querySelectorAll('.fotos-thumb img').forEach(i => i.classList.remove('activa'));
  el.classList.add('activa');
}

function dato(label, valor) {
  if (!valor && valor !== 0) return '';
  return `<div class="dato-row"><span class="dato-label">${label}</span><span class="dato-valor">${valor}</span></div>`;
}

function datoTag(label, valor, cls) {
  if (!valor) return '';
  return `<div class="dato-row"><span class="dato-label">${label}</span><span class="dato-valor"><span class="${cls}">${valor}</span></span></div>`;
}

function irPagina(n) {
  paginaActual = n;
  renderResultados();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function mostrarCargando() {
  document.getElementById('resultado').innerHTML = `
    <div class="estado">
      <div class="spinner"></div>
      <p>Consultando inventario...</p>
    </div>
  `;
  document.getElementById('paginacion-wrap').innerHTML = '';
}

function mostrarEstado(ico, msg) {
  document.getElementById('resultado').innerHTML = `
    <div class="estado"><div class="ico">${ico}</div><p>${msg}</p></div>
  `;
  document.getElementById('paginacion-wrap').innerHTML = '';
}

// Enter en buscador
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') buscar(); });
document.getElementById('marca').addEventListener('keydown', e => { if (e.key === 'Enter') buscar(); });
document.getElementById('modelo').addEventListener('keydown', e => { if (e.key === 'Enter') buscar(); });
document.getElementById('ktype').addEventListener('keydown', e => { if (e.key === 'Enter') buscar(); });
</script>
